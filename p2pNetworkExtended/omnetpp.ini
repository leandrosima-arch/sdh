[General]
network = p2pNetworkExtended
sim-time-limit = 1s


*.visualizer.*.enabled = true
*.visualizer.*.animationSpeed = 20


**.scalar-recording = true
**.vector-recording = true




**.lte*.stmWorkingReceived.record = vector
**.lte*.stmProtectionReceived.record = vector


*.lte*.stmLevel = 16
*.lte*.numTributaries = 2


*.lte*.useProtection = true
*.lte*.protectionSwitchTime = 0.5s


*.source*.packetInterval = 41.62us

*.source*.packetSize = 12480
